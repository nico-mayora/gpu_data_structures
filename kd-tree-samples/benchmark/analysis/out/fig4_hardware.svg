<svg xmlns="http://www.w3.org/2000/svg" width="754" height="438" viewBox="0 0 754 438" class="fig" role="img" aria-label="Fig 4 - Hardware: RTX 3060 Ti runtime relative to RTX 4070">
<style>
  text  { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .title { font-size: 15px; font-weight: 600; }
  .sub   { font-size: 11px; }
  .panel { font-size: 11px; font-weight: 600; }
  .axis  { font-size: 9.5px; font-variant-numeric: tabular-nums; }
  .note  { font-size: 9.5px; }
  /* Heatmap cell values sit on ramp colours that do NOT change between modes,
     so they keep their own fill and are deliberately absent from the dark
     block below -- a .axis dark rule would repaint them into their cells. */
  .cellval { font-size: 9.5px; font-variant-numeric: tabular-nums; font-weight: 600; }
  @media (prefers-color-scheme: dark) {
    .bg    { fill: #1a1a19; }
    .title, .panel { fill: #ffffff; }
    .sub   { fill: #c3c2b7; }
    .axis  { fill: #c3c2b7; }
    .note  { fill: #8a8880; }
    .grid  { stroke: #2e2e2c; }
    .ring  { stroke: #1a1a19; }
    /* Element-qualified: a bare `.s-x { fill }` rule would beat the fill="none"
       presentation attribute on the polylines and fill each line into a closed
       polygon. Strokes and fills must be re-declared per element type. */
    polyline.s-global, path.s-global   { stroke: #3987e5; fill: none; }
    polyline.s-caustic, path.s-caustic { stroke: #d95926; fill: none; }
    polyline.s-0, path.s-0 { stroke: #3987e5; fill: none; }
    polyline.s-1, path.s-1 { stroke: #d95926; fill: none; }
    polyline.s-2, path.s-2 { stroke: #199e70; fill: none; }
    circle.s-global,  text.s-global  { fill: #3987e5; }
    circle.s-caustic, text.s-caustic { fill: #d95926; }
    /* Hollow GPU markers keep the surface as their fill, not the series hue. */
    rect.s-global  { stroke: #3987e5; fill: #1a1a19; }
    rect.s-caustic { stroke: #d95926; fill: #1a1a19; }
    circle.s-0, text.s-0 { fill: #3987e5; }
    circle.s-1, text.s-1 { fill: #d95926; }
    circle.s-2, text.s-2 { fill: #199e70; }
    circle.ring { stroke: #1a1a19; }
  }
</style>
<rect class="bg" fill="#fcfcfb" x="0" y="0" width="754" height="438"/>
<text class="title" fill="#0b0b0b" x="24.0" y="30.0">Fig 4 - Hardware: RTX 3060 Ti runtime relative to RTX 4070</text>
<text class="sub" fill="#52514e" x="24.0" y="48.0">Each cell is RTX 3060 Ti ms / RTX 4070 ms for the same scene, photon budget and K. 1.0x = identical; 2.0x = twice as slow.</text>
