<text class="axis" fill="#52514e" x="483.0" y="359.0" text-anchor="middle">1M</text>
<text class="axis" fill="#52514e" x="523.6" y="359.0" text-anchor="middle">2M</text>
<text class="axis" fill="#52514e" x="577.4" y="359.0" text-anchor="middle">5M</text>
<text class="axis" fill="#52514e" x="618.0" y="359.0" text-anchor="middle">10M</text>
<line class="grid" stroke="#e6e5e2" stroke-width="1" x1="78.0" y1="346.0" x2="618.0" y2="346.0"/>
<line class="grid" stroke="#e6e5e2" x1="78" y1="346.0" x2="618" y2="346.0" stroke-width="1.5"/>
<text class="note" fill="#8a8880" x="84.0" y="340.0">1x - K costs nothing</text>
<polyline class="s-0" points="78.0,113.5 483.0,191.2 618.0,298.3" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle class="ring s-0" cx="78.0" cy="113.5" r="4" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<circle class="ring s-0" cx="483.0" cy="191.2" r="4" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<circle class="ring s-0" cx="618.0" cy="298.3" r="4" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
