<text class="axis" fill="#52514e" x="172.4" y="359.0" text-anchor="middle">5k</text>
<text class="axis" fill="#52514e" x="213.0" y="359.0" text-anchor="middle">10k</text>
<text class="axis" fill="#52514e" x="253.6" y="359.0" text-anchor="middle">20k</text>
<text class="axis" fill="#52514e" x="307.4" y="359.0" text-anchor="middle">50k</text>
