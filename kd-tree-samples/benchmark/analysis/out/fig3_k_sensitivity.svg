<text class="note" fill="#8a8880" x="618.0" y="288.3" text-anchor="middle">2.5x</text>
<text class="note" fill="#8a8880" x="78.0" y="103.5" text-anchor="middle">87.9x</text>
<polyline class="s-1" points="483.0,180.5 618.0,173.9" fill="none" stroke="#eb6834" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle class="ring s-1" cx="483.0" cy="180.5" r="4" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
<circle class="ring s-1" cx="618.0" cy="173.9" r="4" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
<text class="axis lbl s-1" x="627.0" y="177.4" fill="#eb6834" font-weight="600">sponza</text>
<text class="note" fill="#8a8880" x="483.0" y="170.5" text-anchor="middle">24.2x</text>
<text class="note" fill="#8a8880" x="618.0" y="163.9" text-anchor="middle">27.5x</text>
<polyline class="s-2" points="78.0,223.3 348.0,328.4 442.4,340.0" fill="none" stroke="#1baf7a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle class="ring s-2" cx="78.0" cy="223.3" r="4" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/>
<circle class="ring s-2" cx="348.0" cy="328.4" r="4" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/>
<circle class="ring s-2" cx="442.4" cy="340.0" r="4" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/>
<text class="axis lbl s-2" x="451.4" y="343.5" fill="#1baf7a" font-weight="600">water-caustic</text>
<text class="note" fill="#8a8880" x="442.4" y="330.0" text-anchor="middle">1.1x</text>
<text class="note" fill="#8a8880" x="78.0" y="213.3" text-anchor="middle">10.6x</text>
<text class="sub" fill="#52514e" x="348.0" y="380.0" text-anchor="middle">requested global photon budget</text>
<text class="sub" fill="#52514e" x="20.0" y="221.0" text-anchor="middle" transform="rotate(-90 20 221.0)">time(K=128) / time(K=4)</text>
<text class="note" fill="#8a8880" x="24.0" y="408.0">x axis is the *requested* budget: the emitter's actual yield ranges 18%-186%, and no log survives for most of these configurations.</text>
<text class="note" fill="#8a8880" x="24.0" y="421.0">sponza has only two budgets and runs counter to the trend -- treat as provisional until re-run.</text>
</svg>