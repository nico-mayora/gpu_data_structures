<text class="axis" fill="#52514e" x="73.0" y="265.4" text-anchor="end">5x</text>
<line class="grid" stroke="#e6e5e2" stroke-width="1" x1="78.0" y1="226.4" x2="618.0" y2="226.4"/>
<text class="axis" fill="#52514e" x="73.0" y="229.4" text-anchor="end">10x</text>
<line class="grid" stroke="#e6e5e2" stroke-width="1" x1="78.0" y1="190.4" x2="618.0" y2="190.4"/>
<text class="axis" fill="#52514e" x="73.0" y="193.4" text-anchor="end">20x</text>
